[project]
name = "grii-europe-slide-maker"
version = "0.1.0"
description = ""
authors = [{ name = "stepkurniawan", email = "stepkurniawan@gmail.com" }]
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
    "streamlit>=1.47.0,<2",
    "requests>=2.32.4,<3",
    "python-pptx>=1.0.2,<2",
    "protobuf>=6.31.1,<7",
    "google-auth-oauthlib>=1.2.2,<2",
    "google-api-python-client>=2.177.0,<3",
    "htbuilder==0.6.1",
    "pydantic>=2.11.7,<3.0.0",
    "bs4>=0.0.2",
    "pydantic-settings>=2.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "*.py",
    "README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
